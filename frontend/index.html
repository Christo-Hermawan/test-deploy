<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Test Deploy: Vercel + Render</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 560px;
    margin: 80px auto;
    padding: 0 20px;
    color: #1a1a1a;
  }
  h1 { font-size: 1.4rem; }
  button {
    background: #111;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:hover { background: #333; }
  pre {
    background: #f4f4f4;
    padding: 14px;
    border-radius: 6px;
    margin-top: 16px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .status { font-size: 0.85rem; color: #666; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Test Deployment: Frontend (Vercel) → Backend (Render)</h1>
  <p>Klik tombol di bawah buat manggil API dari backend Spring Boot.</p>
  <button id="btn">Panggil Backend</button>
  <div class="status" id="status"></div>
  <pre id="result">(belum ada response)</pre>

  <script>
    // GANTI dengan URL Render setelah backend selesai dideploy,
    // contoh: https://demo-backend-xxxx.onrender.com
    const API_URL = "https://GANTI-DENGAN-URL-RENDER-KAMU.onrender.com";

    const btn = document.getElementById('btn');
    const result = document.getElementById('result');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
      status.textContent = "Memanggil backend... (kalau baru bangun dari sleep, bisa 30-60 detik)";
      result.textContent = "";
      try {
        const start = performance.now();
        const res = await fetch(`${API_URL}/api/hello`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const elapsed = ((performance.now() - start) / 1000).toFixed(1);
        status.textContent = `Berhasil dalam ${elapsed} detik.`;
        result.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        status.textContent = "Gagal memanggil backend.";
        result.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
